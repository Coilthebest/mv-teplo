<!doctype html><html lang="ru"><head>
<link rel="icon" href="/favicon.png?v=teplo2" sizes="120x120" type="image/png">
<link rel="icon" href="/favicon.ico?v=teplo2" sizes="16x16 32x32 48x48" type="image/x-icon">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Выбор ПВЗ Яндекс Маркета</title><style>html,body,#delivery-widget{width:100%;height:100%;margin:0}body{font:13px/1.6 Arial,sans-serif;color:#826345;background:#fffaf1}#widget-message{position:absolute;inset:0;display:grid;place-items:center;padding:25px;text-align:center;pointer-events:none}#widget-message[hidden]{display:none}</style></head><body><div id="delivery-widget"></div><div id="widget-message" role="status">Загружаем карту пунктов выдачи…</div><script>
/* The third-party map runs in a sandbox with no access to the checkout document. */
'use strict';
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const city = (params.get('city') || '').trim().slice(0, 120);
  const requestId = params.get('requestId');
  const message = document.querySelector('#widget-message');
  let started = false;
  const send = (type, payload = {}) => parent.postMessage({ type, requestId, ...payload }, '*');
  function fail() {
    message.hidden = false;
    message.textContent = 'Не удалось открыть карту Яндекса. Закройте карту и попробуйте снова.';
    send('teplo:pickup-error');
  }
  if (!city || !requestId) { fail(); return; }
  const normalize = value => String(value || '').toLocaleLowerCase('ru-RU').replace(/[,\s]+/g, ' ').trim();
  function visibleDetailRows() {
    return [...document.querySelectorAll('#delivery-widget .widget__point-detail-text')]
      .filter(row => row.getClientRects().length && getComputedStyle(row).visibility !== 'hidden')
      .map(row => row.textContent.trim());
  }
  // Save the visible card before the widget's confirmation handler can change it.
  let confirmedRows = [], confirmedAt = 0;
  document.getElementById('delivery-widget').addEventListener('click', event => {
    const button = event.target.closest('button');
    if (button && /^(Отправить сюда|Продолжить|Выбрать)$/u.test(button.textContent.trim())) {
      confirmedRows = visibleDetailRows();
      confirmedAt = Date.now();
    }
  }, true);
  function displayedDeliveryDate(address, rows) {
    // Only use the visible date on the card of this exact selected PVZ.
    if (!rows.some(row => normalize(row) === normalize(address))) return '';
    const dates = rows.map(row => /^Доставка\s+(.+?)\s*•\s*/iu.exec(row)?.[1]?.trim()).filter(Boolean);
    return dates.length === 1 ? dates[0] : '';
  }
  document.addEventListener('YaNddWidgetPointSelected', event => {
    const detail = event.detail;
    if (!detail?.id || !detail.address) return;
    const address = detail.address.full_address || [detail.address.locality, detail.address.street, detail.address.house].filter(Boolean).join(', ');
    const deliveryDate = displayedDeliveryDate(address, visibleDetailRows()) ||
      (Date.now() - confirmedAt < 5000 ? displayedDeliveryDate(address, confirmedRows) : '');
    confirmedRows = [];
    send('teplo:pickup-selected', { point: {
      id: String(detail.id), city: detail.address.locality || city,
      address,
    }, deliveryDate });
  });
  function start() {
    if (started || !window.YaDelivery?.createWidget) return;
    started = true;
    try {
      window.YaDelivery.createWidget({ containerId: 'delivery-widget', params: {
        city, size: { height: `${Math.max(300, innerHeight)}px`, width: '100%' },
        source_platform_station: '019f46fa88c57301bc0086cb90388ac2',
        physical_dims_weight_gross: 2000,
        // The default calendar estimate matches our PVZ-to-PVZ schedule on the checked Moscow route.
        // An extra delivery_term day would push that estimate one day too far out.
        delivery_term: 0,
        delivery_price: () => 'По условиям Teplo',
        show_select_button: true,
        filter: { type: ['pickup_point'], operator_ids: ['market_l4g'], payment_methods: ['already_paid'] },
      } });
      message.hidden = true;
      send('teplo:pickup-ready');
    } catch { fail(); }
  }
  document.addEventListener('YaNddWidgetLoad', start);
  const script = document.createElement('script');
  script.src = 'https://widget-pvz.dostavka.yandex.net/widget.js?v=2';
  script.async = true; script.referrerPolicy = 'no-referrer';
  script.addEventListener('load', start); script.addEventListener('error', fail);
  document.head.append(script);
  setTimeout(() => { if (!started) fail(); }, 14000);
})();

</script></body></html>
