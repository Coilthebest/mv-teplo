<!doctype html>
<html lang="ru"><link rel="icon" href="/favicon.png?v=teplo2" sizes="120x120" type="image/png">
<link rel="icon" href="/favicon.ico?v=teplo2" sizes="16x16 32x32 48x48" type="image/x-icon">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>img, canvas, svg image { -webkit-touch-callout: none; -webkit-user-drag: none; }</style><script src="image-interactions.js" defer></script>
<title>Подпись для HD-постера · Teplo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf4e8;color:#4e3022;font:16px/1.5 system-ui,sans-serif}main{max-width:970px;margin:auto;padding:clamp(18px,4vw,52px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}h1{font:normal 38px/1.1 Georgia,serif;margin:0 0 14px}label{display:block;margin:18px 0 4px}input:not([type=checkbox]){width:100%;padding:11px;border:1px solid #bda98f;border-radius:6px;background:#fffaf2;font:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:6px;background:#623820;color:white;font:inherit}button:disabled{opacity:.45}canvas{width:100%;height:auto;box-shadow:0 8px 25px #59341e20}@media(max-width:650px){main{grid-template-columns:1fr;gap:20px}h1{font-size:31px}}
</style><main><section><h1>Подпись для HD-постера</h1><p>Выбери чистый оригинал из своего бакета. Редактор работает на твоём устройстве.</p>
<label for="file">Иллюстрация</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<label for="title">Название</label><input id="title" maxlength="32" placeholder="Эверест">
<label for="year">Год</label><input id="year" inputmode="numeric" maxlength="4" placeholder="2023">
<label><input id="lines" type="checkbox" checked> Полоски по бокам года</label>
<button id="download" type="button" disabled>Скачать постер · PNG</button>
<p id="status" role="status"></p></section><canvas hidden aria-label="Предпросмотр постера"></canvas></main>
<script>
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const input=id=>document.getElementById(id);
let picture, revision=0;
function render(){
  if(!picture) return;
  const w=canvas.width,h=canvas.height;
  ctx.drawImage(picture,0,0,w,h);
  ctx.save();
  ctx.scale(w/1200,h/1600);
  ctx.fillStyle='#68503b';
  function caption(text,y,size,space){
    const letters=Array.from(text);
    ctx.font=size+'px Georgia,serif';
    const widths=letters.map(c=>ctx.measureText(c).width);
    const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,letters.length-1)*space;
    ctx.save();ctx.translate(600,y);const scale=Math.min(1,900/Math.max(1,total));ctx.scale(scale,scale);
    let x=-total/2;
    letters.forEach((c,i)=>{ctx.fillText(c,x,0);x+=widths[i]+space});
    ctx.restore();return total*scale;
  }
  const title=input('title').value.trim().toLocaleUpperCase('ru'),year=input('year').value.trim();
  if(title)caption(title,1360,47,12);
  if(year){const y=title?1422:1360,edge=caption(year,y,30,12)/2+30;
    if(input('lines').checked){ctx.fillStyle='#9e7c5e';ctx.fillRect(600-edge-62,y-10,62,1.5);ctx.fillRect(600+edge,y-10,62,1.5);}
  }
  ctx.restore();
}
input('file').onchange=async e=>{
  const current=++revision,file=e.target.files[0];picture=null;input('download').disabled=true;canvas.hidden=true;input('status').textContent='';
  if(!file)return;
  const url=URL.createObjectURL(file);
  try{const image=new Image();image.src=url;await image.decode();if(current!==revision)return;
    picture=image;canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
    render();canvas.hidden=false;input('download').disabled=false;input('status').textContent=canvas.width+' × '+canvas.height+' пикселей';
  }catch{if(current===revision)input('status').textContent='Не удалось открыть изображение. Выбери PNG, JPG или WebP.'}
  finally{URL.revokeObjectURL(url)}
};
for(const id of ['title','year','lines'])input(id).oninput=render;
input('download').onclick=()=>{
  if (!picture) return;
  const link=document.createElement('a');
  const name=[input('title').value.trim(),input('year').value.trim()].filter(Boolean).join('-');
  link.download=(name.replace(/[\\/:*?"<>|]/g,'-') || 'Teplo-постер')+'.png';
  try {
    link.href=canvas.toDataURL('image/png');
    if (link.href==='data:,') throw new Error();
    document.body.appendChild(link);
    link.click();
  } catch {
    input('status').textContent='Не удалось сохранить постер. Попробуй ещё раз.';
  } finally {
    link.remove();
  }
};
</script></html>
