<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Модерация сообщений · Teplo</title>
  <link rel="stylesheet" href="styles.css?v=upright2">
  <link rel="stylesheet" href="feedback.css?v=1">
  <script src="feedback.js?v=1" defer></script>
</head>
<body>
  <main class="container feedback-admin" id="feedback-admin">
    <a class="text-link" href="/#feedback">Отзывы и вопросы на Teplo</a>
    <h2>Модерация <em>сообщения</em></h2>
    <p id="moderation-status" role="status">Открываем сообщение…</p>
    <div id="moderation-preview"></div>
    <form class="feedback-form" id="moderation-form" hidden>
      <label>Ответ от Teplo <span class="feedback-muted">(необязательно)</span>
        <textarea id="moderation-reply" maxlength="1000" rows="3"></textarea>
      </label>
      <div class="feedback-actions">
        <button class="button button-primary" type="submit" value="publish">Опубликовать</button>
        <button class="button button-outline" type="submit" value="hide" hidden>Скрыть с сайта</button>
      </div>
    </form>
  </main>
</body>
</html>
