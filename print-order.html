<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="/favicon.png?v=teplo2" sizes="120x120" type="image/png">
<link rel="icon" href="/favicon.ico?v=teplo2" sizes="16x16 32x32 48x48" type="image/x-icon">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Макеты заказа · Teplo</title>
  <script defer src="print-placement.js?v=product-preview1"></script>
  <script defer src="realistic-mockups.js?v=1"></script>
  <script defer src="story-storage.js?v=1"></script>
  <script defer src="illustration.js?v=digital-paper4"></script>
  <script defer src="order-archive.js?v=fixedpaper3"></script>
  <script defer src="print-order.js?v=hd-originals1"></script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none; }
    body { margin: 0; background: #f9f0e0; color: #523321; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 600px; margin: auto; padding: 32px 20px; }
    h1, h2 { font-family: Georgia, serif; font-weight: normal; }
    h1 { margin: 0 0 12px; }
    article { margin-top: 18px; padding: 18px; background: #fffaf1; border: 1px solid #e4caa8; border-radius: 12px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    button, a[download] { display: inline-block; padding: 9px 14px; border: 0; border-radius: 6px; background: #673d28; color: #fffaf1; font: inherit; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    article img { display: block; width: 184px; max-width: 100%; height: auto; margin: 14px 0; }
    .product-preview { width: min(100%, 320px); margin: 14px 0; }
    .product-preview img { width: 100%; margin: 0; border-radius: 8px; }
    .product-preview figcaption { margin-top: 5px; color: #755842; font-size: 14px; }
    .download-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .download-actions .download-print { color: #673d28; background: transparent; box-shadow: inset 0 0 0 1px #cbb292; }
    .placement { color: #755842; }
    p[role="status"]:empty { display: none; }
    article p { margin: 0 0 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Макеты заказа</h1>
    <p id="order-number" hidden></p>
    <p id="status" role="status">Загружаем заказ…</p>
    <button id="download-all" type="button" hidden>Подготовить все макеты ZIP</button>
    <p id="archive-status" role="status"></p>
    <button id="download-hd" type="button" hidden>Скачать все HD-иллюстрации</button>
    <p id="hd-status" role="status"></p>
    <div id="prints"></div>
  </main>
</body>
</html>
